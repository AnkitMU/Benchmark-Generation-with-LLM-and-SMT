suite_name: "Closure-Org-Test"
version: "3.0"
description: "Exercise closure_operation / acyclicity on a model with self-associations."

generation_mode: construct_select

models:
  - xmi: "closure_test/org.xmi"
    name: "Org"
    profiles:
      - name: "closure"
        seed: 7
        constraints: 60
        sat_ratio: 0.8
        unsat_ratio: 0.2
        target_tc_range: {min: 1.0, max: 60.0}
        tc_difficulty_mix: {trivial: 10, easy: 30, medium: 30, hard: 20, expert: 10}
        families_pct:
          navigation: 70
          cardinality: 15
          arithmetic: 15
        per_class_min: 1
        per_class_max: 40
        similarity_threshold: 0.90

semantic:
  enable: false

vgcr:
  enable: true
  max_retries: 3
  enable_independence_check: false

verification:
  enable: true
  objective: "both"
  scope_per_class: 4
  per_constraint_timeout_ms: 30000
  batch_timeout_ms: 300000
  check_global_consistency: true

output_root: "closure_test/out/"
framework_version: "3.0"
