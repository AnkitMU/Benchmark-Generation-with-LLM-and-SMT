semantic:
  enable: true
  model: phi4-mini
  ollama_url: http://localhost:11434
  use_cache: true
vgcr:
  enable: true
  max_retries: 15
  enable_independence_check: false
  tc_range_override:
    min: 0.0
    max: 10000.0
verification:
  enable: true
  objective: both
  scope_per_class: 6
  per_constraint_timeout_ms: 15000
  batch_timeout_ms: 120000
output_root: benchmarks/paper/with_vgcr/
framework_version: '3.0'
